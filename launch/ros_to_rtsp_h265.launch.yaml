#
# Low-latency ROS image topic -> H.265/HEVC RTSP relay.
#
# Usually only input_topic and output_topic need changing:
#   ros2 launch rtsp_image_transport ros_to_rtsp_h265.launch.yaml \
#     input_topic:=/camera/image_raw \
#     output_topic:=/camera/image_h265/rtsp
#
# H.265 saves bandwidth but is not as universally supported as H.264.

launch:
  - arg:
      name: input_topic
      default: /camera/image_raw
      description: Raw sensor_msgs/Image topic to encode
  - arg:
      name: output_topic
      default: /camera/image_h265/rtsp
      description: std_msgs/String topic on which the RTSP URL is advertised
  - arg:
      name: rtsp_port
      default: '8556'
      description: TCP port on which the RTSP server listens
  - arg:
      name: bitrate
      default: '6000000'
      description: Target video bitrate in bits per second
  - arg:
      name: framerate
      default: '30'
      description: Expected source frame rate
  - arg:
      name: intra_refresh
      default: 'false'
      description: >-
        Sweep a band of intra macroblocks across the picture instead of
        sending periodic key frames. On a lossy link this removes the single
        large indispensable picture whose loss corrupts everything after it,
        at the cost of bitrate.
  - arg:
      name: keyframe_interval
      default: '0'
      description: >-
        Frames between key frames (0 = one per second, from framerate).
        Shortening it costs bandwidth and lets a client joining mid-stream
        start sooner; it is not a remedy for packet loss.

  - node:
      pkg: image_transport
      exec: republish
      name: image_to_rtsp_h265
      output: screen
      param:
        - name: in_transport
          value: raw
        - name: out_transport
          value: rtsp
        - name: out.rtsp.codec
          value: H265
        - name: out.rtsp.target_bitrate
          value: $(var bitrate)
          type: int
        - name: out.rtsp.expected_framerate
          value: $(var framerate)
          type: int
        - name: out.rtsp.keyframe_interval
          value: $(var keyframe_interval)
          type: int
        - name: out.rtsp.intra_refresh
          value: $(var intra_refresh)
          type: bool
        - name: out.rtsp.use_hw_encoder
          value: true
        - name: out.rtsp.udp_port
          value: $(var rtsp_port)
          type: int
        - name: out.rtsp.udp_packet_size
          value: 1396
        - name: out.rtsp.use_ip_multicast
          value: false

        # Best-effort accepts both SensorDataQoS and reliable image sources.
        # Depth 1 prevents stale frames from accumulating ahead of the encoder.
        - name: qos_overrides.$(var input_topic).subscription.reliability
          value: best_effort
        - name: qos_overrides.$(var input_topic).subscription.history
          value: keep_last
        - name: qos_overrides.$(var input_topic).subscription.depth
          value: 1
        - name: qos_overrides.$(var input_topic).subscription.durability
          value: volatile
      remap:
        - from: in
          to: $(var input_topic)
        - from: out/rtsp
          to: $(var output_topic)
